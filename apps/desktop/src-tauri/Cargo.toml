[package]
name = "pairlens-desktop"
version = "0.4.0"
description = "Pairlens Desktop — AI-native crypto spot trading terminal"
authors = ["Pairlens"]
license = "FSL-1.1-Apache-2.0"
edition = "2021"

[[bin]]
name = "Pairlens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# `unstable` is required for multi-webview: the in-app web pane creates child
# webviews (`new Webview()` from @tauri-apps/api in web-pane.tsx).
# `tray-icon` backs background mode on Windows/Linux (tray.rs) — the only way
# back to a window that was hidden instead of closed. macOS uses the Dock icon.
tauri = { version = "2.0", features = ["unstable", "tray-icon"] }
tauri-plugin-websocket = "2.0"
tauri-plugin-shell = "2.0"
# Connector REST from the Rust side. The webview's own fetch enforces CORS just
# like a browser, and several exchanges (OKX EEA, Coinbase Advanced Trade,
# KuCoin, Bitfinex, MEXC, Gate, HTX) send no Access-Control-Allow-Origin at all,
# so market history is unreachable from a packaged build over webview fetch.
# Reachable hosts are pinned by scope in capabilities/default.json.
tauri-plugin-http = "2"
# Auto-update: checks the release manifest, downloads + installs signed
# update packages (Spotify/Figma-style in-place updates).
tauri-plugin-updater = "2"
# Relaunch after an update is installed.
tauri-plugin-process = "2"
# Native OS notifications (Notification Center / toast). The webview
# Notification API is not implemented by WKWebView, so without this plugin
# alerts in background mode (hidden window) would vanish silently on macOS.
tauri-plugin-notification = "2"
# Focus the existing window instead of launching a second app instance
# (duplicate instances would double WS connections and notifications).
tauri-plugin-single-instance = "2"
# Remember window size/position across launches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CSP script nonces (csp.rs): the SPA shell boots via inline scripts, allowed
# per-response by nonce + 'strict-dynamic' instead of 'unsafe-inline'.
base64 = "0.22"
getrandom = "0.2"
# OS credential storage: macOS Keychain / Windows Credential Manager / Linux Secret Service
# Idle-sleep inhibition while trading bots are armed (awake.rs). Bots run
# locally, so a machine that suspends mid-position stops managing it.
keepawake = { version = "0.6", default-features = false }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

# Touch ID protector for the credential vault (src/biometric.rs).
#
# `security-framework` is already in the lock file via `keyring`, so naming it
# here adds no new crates; `objc2-local-authentication` adds exactly one, since
# its objc2 / objc2-foundation / block2 dependencies are already pulled in by
# Tauri. The official `tauri-plugin-biometric` is deliberately NOT used: its
# dependency list carries no platform crates at all — it is a bridge to the
# Swift and Kotlin sides shipped for iOS/Android, with no desktop
# implementation to call.
[target.'cfg(target_os = "macos")'.dependencies]
# OSX_10_15 unlocks `PasswordOptions::use_protected_keychain()` —
# kSecUseDataProtectionKeychain — which biometric.rs sets on every call so the
# Touch ID item deterministically lives in the data protection keychain
# rather than wherever the ACL happens to route it.
security-framework = { version = "3", features = ["OSX_10_15"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "LABase",
    "LAContext",
    "LAError",
] }
zeroize = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Production profile (Tauri-recommended): single codegen unit + fat LTO for
# better optimization, stripped symbols and abort-on-panic for a smaller
# binary. Release builds get slower to compile; dev builds are unaffected.
[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
