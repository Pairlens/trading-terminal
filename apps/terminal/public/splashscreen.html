<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        /* Matches the app's dark --background token (oklch(13.5% 0.006 74))
           so splash → terminal is a continuous surface, not a color jump. */
        background: #0a0806;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      img {
        /* The wordmark is 5.2:1, so width is what sets its presence on a
           480x320 window: at the old 52% cap it read as a sticker lost in
           the middle of the frame. 72% leaves a clear margin either side. */
        max-width: 72%;
        max-height: 52%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img src="/wordmark.webp" alt="" />
  </body>
</html>
