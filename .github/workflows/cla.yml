name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# CLA Assistant Lite (contributor-assistant/github-action). Blocks PRs until
# the author has signed the Individual CLA (CLA/individual-cla.md) by posting
# the signing comment. Signatures are committed to the `cla-signatures` branch
# of this repo at signatures/version1/cla.json. Corporate contributors sign
# CLA/corporate-cla.md out-of-band and their designated employees are added to
# the allowlist.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Pairlens/trading-terminal/blob/main/CLA/individual-cla.md'
          branch: 'cla-signatures'
          allowlist: juanignaciomolina,dependabot[bot],github-actions[bot],claude[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge this, we need you
            to sign the [Pairlens Individual Contributor License
            Agreement](https://github.com/Pairlens/trading-terminal/blob/main/CLA/individual-cla.md).
            Post the comment below to sign. Contributing on behalf of your
            employer? Have them execute the [Corporate
            CLA](https://github.com/Pairlens/trading-terminal/blob/main/CLA/corporate-cla.md)
            instead — see CONTRIBUTING.md.
          lock-pullrequest-aftermerge: 'false'
