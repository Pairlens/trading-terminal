name: Community plugins

# Validates community plugin submissions (apps/registry/community/**):
# manifest schema, store metadata, capability policy (no trading), namespace
# ownership (plugin id prefix must match the PR author's GitHub user), and
# that the source actually builds under the community size cap.
on:
  pull_request:
    paths:
      - 'apps/registry/community/**'

concurrency:
  group: community-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Determine changed submissions
        id: changed
        run: |
          dirs=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD -- apps/registry/community/ \
            | awk -F/ 'NF > 3 { print $4 }' | sort -u | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Changed submissions: $dirs"
      - name: Validate and build
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bun apps/registry/scripts/validate-community.ts ${{ steps.changed.outputs.dirs }}
